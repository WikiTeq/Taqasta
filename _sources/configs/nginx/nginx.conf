# Main nginx configuration for the Taqasta nginx service (mounted statically
# at /etc/nginx/nginx.conf; the vhost itself is rendered from
# _sources/configs/nginx/vhost.conf.template by the official image's
# envsubst-on-templates mechanism).
#
# Runs workers as the image's built-in "nginx" user; the docroot mirror in
# the shared volume is created world-readable by run-apache-pre.sh, so no
# group juggling between containers is needed.
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Apache "docker" LogFormat from _sources/configs/mediawiki.conf:
    # %a %l %u %t "%r" %>s %b "%{Referer}i" "%{User-Agent}i"
    log_format docker '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent"';
    access_log  /var/log/nginx/access.log  docker;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;

    include /etc/nginx/conf.d/*.conf;
}
