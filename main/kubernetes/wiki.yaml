apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wiki
spec:
  selector:
    matchLabels:
      app: wiki
  replicas: 1
  template:
    metadata:
      labels:
        app: wiki
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: pool
                operator: In
                values:
                - shared
      tolerations:
      - key: "pool"
        value: "shared"
        effect: "NoSchedule"
      initContainers:
        # init container (runs once, delays both app and sidecar containers), see https://github.com/kubernetes/git-sync
        - name: git-sync-once
          image: registry.k8s.io/git-sync/git-sync:v4.4.0
          command:
            - sh
            - -c
            - |
              mkdir -p /root/.ssh
              /git-sync \
                --http-bind=:8080 \
                --period=60s \
                --github-app-private-key-file=/ssh/key \
                --github-app-installation-id=${GHAPP_INSTALLID} \
                --github-app-application-id=${GHAPP_APPID} \
                --repo=https://github.com/WikiTeq/Taqasta.git \
                --root=/git \
                --link=head \
                --ssh-known-hosts=false \
                -v=10 \
                --ref=master
          restartPolicy: Always
          startupProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 1
            failureThreshold: 180
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: git
              mountPath: /git
            - name: gitsync-ghappprivatekey
              mountPath: /ssh
          envFrom:
            - configMapRef:
                name: gitsync-env
      containers:
        - name: taqasta
          image: ghcr.io/wikiteq/taqasta:latest
          command:
            - sh
            - -c
            - |
              # Symlinks pointed to git-sync resources instead of docker-compose mounts
              mkdir -p /var/www/mediawiki/w/_settings
              ln -sf /git/head/main/LocalSettings.dev.php /var/www/mediawiki/w/_settings/LocalSettings.php

              # WIK-2139: this container runs php-fpm; HTTP and static files
              # are served by the nginx sidecar from the docroot mirror in
              # $MW_VOLUME/docroot. The bootstrap inside run-apache-fpm.sh
              # already synced the mirror once; this background loop refreshes
              # it periodically so nginx picks up git-sync deployments.
              (
                while true; do
                  rsync -a --delete \
                    --exclude '/images/' --exclude '/log/' \
                    /var/www/mediawiki/ "$MW_VOLUME/docroot/" || true
                  sleep 60
                done
              ) &
              # Start php-fpm in foreground
              /run-apache-fpm.sh
          envFrom:
            - configMapRef:
                name: wiki-env
            - secretRef:
                name: wiki-secrets
          env:
            - name: MW_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: mysql-env
                  key: MYSQL_DATABASE
            # note: both install and user ops are as root for now
            - name: MW_DB_PASS
              valueFrom:
                secretKeyRef:
                  name: mysql-password
                  key: password
            - name: MW_DB_INSTALLDB_PASS
              valueFrom:
                secretKeyRef:
                  name: mysql-password
                  key: password
          ports:
          # WIK-2139: php-fpm listener; HTTP is served by the nginx sidecar
          - containerPort: 9000
            name: fpm
          volumeMounts:
          - name: git
            mountPath: /git
          - name: data
            mountPath: /mediawiki
          - name: images
            mountPath: /mediawiki/images
        # WIK-2139: external nginx sidecar replaces the bundled Apache. It
        # serves static files from the docroot mirrored into the shared
        # "data" volume and forwards PHP to php-fpm on the taqasta container.
        - name: nginx
          image: nginx:alpine
          ports:
          - containerPort: 80
            name: http
          env:
          - name: NGINX_UPSTREAM
            value: localhost:9000
          - name: NGINX_CLIENT_MAX_BODY_SIZE
            value: 500M
          volumeMounts:
          - name: data
            mountPath: /mediawiki
            readOnly: true
          - name: nginx-config
            mountPath: /etc/nginx/nginx.conf
            subPath: nginx.conf
            readOnly: true
          - name: nginx-config
            mountPath: /etc/nginx/templates/default.conf.template
            subPath: default.conf.template
            readOnly: true
          - name: nginx-config
            mountPath: /etc/nginx/fastcgi_params.conf
            subPath: fastcgi_params.conf
            readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: wiki-0
      - name: images
        persistentVolumeClaim:
          claimName: wiki-images
      - name: git
        emptyDir: {}
      - name: gitsync-ghappprivatekey
        secret:
          secretName: gitsync-ghappprivatekey
          defaultMode: 0400
      # WIK-2139: nginx sidecar configuration
      - name: nginx-config
        configMap:
          name: wiki-nginx-config
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wiki-0
spec:
  # https://help.ovhcloud.com/csm/en-public-cloud-kubernetes-persistent-volumes?id=kb_article_view&sysparm_article=KB0049928
  storageClassName: csi-cinder-high-speed
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wiki-images
spec:
  # https://help.ovhcloud.com/csm/en-public-cloud-kubernetes-persistent-volumes?id=kb_article_view&sysparm_article=KB0049928
  storageClassName: csi-cinder-high-speed
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: wiki-service
spec:
  ports:
    # WIK-2139: served by the nginx sidecar container (was: bundled Apache)
  - port: 80
    targetPort: http
  selector:
    app: wiki
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wiki-ingress
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt"
    external-dns.alpha.kubernetes.io/ttl: "60"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
      - taqasta.teq.wiki
      secretName: cert-secret
  rules:
  - host: taqasta.teq.wiki
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: wiki-service
            port:
              number: 80
---
# WIK-2139: configuration for the nginx sidecar container
apiVersion: v1
kind: ConfigMap
metadata:
  name: wiki-nginx-config
data:
  nginx.conf: |
    user  nginx;
    worker_processes  auto;
    error_log  /var/log/nginx/error.log notice;
    pid        /var/run/nginx.pid;
    events {
        worker_connections  1024;
    }
    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;
        sendfile           on;
        tcp_nopush         on;
        keepalive_timeout  65;
        server_tokens      off;
        include /etc/nginx/conf.d/*.conf;
    }
  default.conf.template: |
    # Placeholders are rendered at start by the official image's
    # envsubst-on-templates mechanism (NGINX_UPSTREAM / NGINX_CLIENT_MAX_BODY_SIZE).
    upstream taqasta_fpm {
        server ${NGINX_UPSTREAM};
    }
    server {
        listen 80 default_server;
        server_name _;
        root /mediawiki/docroot;
        index index.php;
        client_max_body_size ${NGINX_CLIENT_MAX_BODY_SIZE};
        merge_slashes off;
        autoindex off;

        if (-f $document_root/.maintenance) {
            return 503;
        }
        error_page 503 @maintenance_503;
        location @maintenance_503 {
            internal;
            default_type text/html;
            add_header Retry-After "300" always;
            return 503 "<!DOCTYPE html>\n<html><head><title>503 Service Temporarily Unavailable</title></head><body><center><h1>503 Service Temporarily Unavailable</h1><hr/>nginx</center></body></html>\n";
        }

        location = /server-status {
            allow 127.0.0.1;
            deny all;
            stub_status;
        }

        location ~ /\.git {
            return 404;
        }

        location ~* ^/(?:robots\.php|w/(?:index|load|api|rest|img_auth|thumb|opensearch_desc)\.php|w/mw-config/index\.php)(?:$|/) {
            fastcgi_split_path_info ^(.+?\.php)(/.*)$;
            include fastcgi_params.conf;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_pass taqasta_fpm;
        }

        location ~* \.php$ {
            return 404;
        }

        location = /robots.txt {
            include fastcgi_params.conf;
            fastcgi_param SCRIPT_NAME /robots.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root/robots.php;
            fastcgi_param PATH_INFO "";
            fastcgi_pass taqasta_fpm;
        }

        location ~* \.(?:jpg|jpeg|gif|png|webp|svg|ico|mp4|mpeg|mpg|m4v|mov|wmv|avi|webm|ogv|eot|ttf|otf|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public";
            log_not_found off;
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ @indexrouter;
        }
        location @indexrouter {
            rewrite ^ /w/index.php last;
        }
    }
  fastcgi_params.conf: |
    fastcgi_param  SCRIPT_FILENAME    $realpath_root$fastcgi_script_name;
    fastcgi_param  QUERY_STRING       $query_string;
    fastcgi_param  REQUEST_METHOD     $request_method;
    fastcgi_param  CONTENT_TYPE       $content_type;
    fastcgi_param  CONTENT_LENGTH     $content_length;
    fastcgi_param  SCRIPT_NAME        $fastcgi_script_name;
    fastcgi_param  REQUEST_URI        $request_uri;
    fastcgi_param  DOCUMENT_URI       $document_uri;
    fastcgi_param  DOCUMENT_ROOT      $document_root;
    fastcgi_param  SERVER_PROTOCOL    $server_protocol;
    fastcgi_param  REQUEST_SCHEME     $scheme;
    fastcgi_param  HTTPS              $https if_not_empty;
    fastcgi_param  GATEWAY_INTERFACE  CGI/1.1;
    fastcgi_param  SERVER_SOFTWARE    nginx/$nginx_version;
    fastcgi_param  REMOTE_ADDR        $remote_addr;
    fastcgi_param  REMOTE_PORT        $remote_port;
    fastcgi_param  SERVER_ADDR        $server_addr;
    fastcgi_param  SERVER_PORT        $server_port;
    fastcgi_param  SERVER_NAME        $server_name;
    fastcgi_param  REDIRECT_STATUS    200;
