# This is a dev/debug compose file
#
# WIK-2139: HTTP is served by the dedicated `nginx` service, which serves
# static files straight from the shared mediawiki volume and forwards PHP
# requests to php-fpm listening inside the `web` container.
# The previously bundled Apache stays available as a rollback path:
#   docker compose -f docker-compose.sample.yml -f docker-compose.apache.yml up -d

x-web-environment: &x-web-environment
    MW_ADMIN_USER: ${MW_ADMIN_USER:-admin}
    MW_ADMIN_PASS: ${MW_ADMIN_PASS:-Passsw0rd!}
    MW_DB_NAME: ${MW_DB_NAME:-mediawiki}
    MW_DB_INSTALLDB_USER: root
    MW_DB_INSTALLDB_PASS: ${MW_DB_INSTALLDB_PASS:-mediawiki}
    MW_DB_USER: root
    MW_DB_PASS: ${MW_DB_PASS:-mediawiki}
    MW_SITE_SERVER:
    MW_SITE_NAME:
    MW_SITE_LANG:
    MW_DB_TYPE: ${MW_DB_TYPE:-mysql}
    MW_SHOW_EXCEPTION_DETAILS:
    # Red frame + "NOT PRODUCTION" label. Keep false on production wikis.
    MW_SHOW_NON_PROD_INDICATOR: "false"
    PHP_UPLOAD_MAX_FILESIZE: 500M
    PHP_POST_MAX_SIZE: 500M
    # disable bundled runners as we have a worker container now
    MW_ENABLE_TRANSCODER: false
    MW_ENABLE_JOB_RUNNER: false

x-web-volumes: &x-web-volumes
  - mediawiki:/mediawiki
  - ./logstest:/var/log/app
  - ./LocalSettings.dev.php:/mediawiki/config/settings/LocalSettings.dev.php

x-service-worker: &x-service-worker
  build:
    context: .
    dockerfile: Dockerfile
  restart: no
  # overrides the container healthcheck
  healthcheck:
    test: /bin/bash -c "ps -ax | grep '[r]unJobs' | wc -l"
    interval: 5s
    retries: 2
    start_period: 5s
    timeout: 5s
  depends_on:
    web:
      condition: service_healthy
  environment:
    <<: *x-web-environment
    # worker requires custom memory limit for PHP
    # and --memory-limit max on the runner as by default the runner uses 150MiB as max value
    PHP_MEMORY_LIMIT: 128M
  volumes: *x-web-volumes

services:
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=caching_sha2_password --log-bin --binlog-expire-logs-seconds=172800
    cap_add:
      - SYS_NICE  # CAP_SYS_NICE, fix error mbind: Operation not permitted
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_HOST=%
      - MYSQL_ROOT_PASSWORD=${MW_DB_INSTALLDB_PASS:-mediawiki}
      - MYSQL_DATABASE=${MW_DB_NAME:-mediawiki}
    volumes:
      - mysql:/var/lib/mysql

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # WIK-2139: image CMD now runs php-fpm (no HTTP listener). Roll back to
    # the bundled Apache with docker-compose.apache.yml (see file header).
    depends_on:
      - db
    environment: *x-web-environment
    volumes: *x-web-volumes
    # WIK-2139: php-fpm mode — HTTP is served by the nginx service, so probe
    # the local php-fpm listener instead of an HTTP endpoint (same probe as
    # docker-compose.yml; the image's baked-in Apache HTTP check never passes)
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    # External HTTP entrypoint replacing the previously published Apache
    # port on the web service (WIK-2139)
    ports:
      - "${PORT:-127.0.0.1:8000}:80"
    environment:
      NGINX_UPSTREAM: web:9000
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-500M}
    volumes:
      # Read-only view of the wiki files mirrored into the volume by the
      # web entrypoint (docroot lives at /mediawiki/docroot here)
      - mediawiki:/mediawiki:ro
      - ./_sources/configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Rendered at start by the official image's envsubst-on-templates
      # mechanism (NGINX_UPSTREAM / NGINX_CLIENT_MAX_BODY_SIZE placeholders)
      - ./_sources/configs/nginx/vhost.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./_sources/configs/nginx/fastcgi_params.conf:/etc/nginx/fastcgi_params.conf:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      # Self-contained probe: nginx answers with the maintenance page even
      # while the web/fpm service is down, so don't probe /server-status
      # (it proxies to fpm and churns health whenever web restarts)
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    <<: *x-service-worker
    command:
      - /bin/bash
      - -c
      - |
        set -x &&
        echo '=========================================' &&
        echo 'Creating LocalSettings.php symlink...' &&
        ln -sf "$$MW_VOLUME/LocalSettings.php" "$$MW_HOME/LocalSettings.php" || exit 1 &&
        echo "Starting the runJobs script in --wait mode... (PHP_MEMORY_LIMIT->$$PHP_MEMORY_LIMIT)" &&
        php $$MW_HOME/maintenance/run.php runJobs --memory-limit max --wait

  worker-video:
    <<: *x-service-worker
    environment:
      <<: *x-web-environment
      PHP_MEMORY_LIMIT: 256M
    command:
      - /bin/bash
      - -c
      - |
        set -x &&
        echo '=========================================' &&
        echo 'Creating LocalSettings.php symlink...' &&
        ln -sf "$$MW_VOLUME/LocalSettings.php" "$$MW_HOME/LocalSettings.php" || exit 1 &&
        echo "Starting the runJobs script in --wait mode... (PHP_MEMORY_LIMIT->$$PHP_MEMORY_LIMIT)" &&
        php $$MW_HOME/maintenance/run.php runJobs --memory-limit max --wait --type webVideoTranscode

  worker-video-priority:
    <<: *x-service-worker
    environment:
      <<: *x-web-environment
      PHP_MEMORY_LIMIT: 256M
    command:
      - /bin/bash
      - -c
      - |
        set -x &&
        echo '=========================================' &&
        echo 'Creating LocalSettings.php symlink...' &&
        ln -sf "$$MW_VOLUME/LocalSettings.php" "$$MW_HOME/LocalSettings.php" || exit 1 &&
        echo "Starting the runJobs script in --wait mode... (PHP_MEMORY_LIMIT->$$PHP_MEMORY_LIMIT)" &&
        php $$MW_HOME/maintenance/run.php runJobs --memory-limit max --wait --type webVideoTranscodePrioritized

volumes:
  mediawiki:
  mysql:

networks:
  traefik-public:
    external: true
